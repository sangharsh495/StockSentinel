name: Train quant models

on:
  schedule:
    # 12:30 UTC = 6:00 PM IST, Monday to Friday (after NSE close)
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        run: pip install pytest && python -m pytest -q tests
      - name: Train, test and publish models
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ../scripts/train_quant.py --out quant_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: quant-report
          path: backend/quant_report.json
